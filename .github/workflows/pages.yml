name: Ecoajedrez - check and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-ecoajedrez"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: assets/texturas-pbr
          key: ecoajedrez-pbr-1k-v1-${{ hashFiles('scripts/descargar-relieves-pbr.py') }}
      - name: Descargar fototexturas 1K CC0 (solo durante compilación)
        run: python3 scripts/descargar-relieves-pbr.py --strict
      - name: Check JS syntax
        run: |
          node --check main.js
          node --check victory-fx.js
          node --check skybox-test.js
          node --check immersive-chess.js
          node --check immersive-room.js
          node --check piece-pbr.js
          node --check piece-materials.js
          node --check piece-gallery.js
          node --check army-appearance.js
          node --check piece-combat.js
          node --check piece-preview.js
          node --check quest-map.js
          node --check community-models.js
          node --check experience-modes.js
          node --check ar-portal.js
          node --check skybox-config.js
          node --check magic-world.js
          node --check board-skins.js
          node --check board-catalog-ui.js
          node --check last-move-ghost.js
          node --check legal-consent.js
          node --check arcane-ui.js
          node --check opening.js
          node --check qr-scanner.js
          node --check celestial-ui.js
          node --check adventure-ui.js
          node --check asset-cache.js
          node --check sw.js
          node --check commands.js
          node --check pvp.js
          node --check auth.js
          node --check match-state.js
          node --check worker-lib/security.js
          node --check functions/api/auth/session.js
          node --check functions/api/auth/logout.js
          node --check functions/api/auth/google/start.js
          node --check functions/api/auth/google/callback.js
      - name: Report uploaded 3D model inventory (informational)
        run: node scripts/revisar-modelos-3d.mjs
      - name: Check project consistency
        run: |
          node --test tests/*.test.mjs
          node scripts/security-check.mjs
      - name: Build safe static bundle only
        run: |
          node scripts/build-pages.mjs
          node scripts/security-check.mjs
      - name: Publicar paquete descargable de los 9 relieves CC0
        uses: actions/upload-artifact@v4
        with:
          name: ECOAJEDREZ-9-RELIEVES-PBR-1K-CC0
          path: assets/texturas-pbr/
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: assets/texturas-pbr
          key: ecoajedrez-pbr-1k-v1-${{ hashFiles('scripts/descargar-relieves-pbr.py') }}
      - name: Preparar mapas CC0 en entrega (descargados o desde caché)
        run: python3 scripts/descargar-relieves-pbr.py --strict
      - name: Build isolated static bundle
        run: |
          node scripts/build-pages.mjs
          node scripts/security-check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
