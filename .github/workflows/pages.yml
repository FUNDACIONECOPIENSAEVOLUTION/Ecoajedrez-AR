name: Ecoajedrez - check and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-ecoajedrez"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check main.js
          node --check magic-world.js
          node --check board-skins.js
          node --check board-catalog-ui.js
          node --check last-move-ghost.js
          node --check legal-consent.js
          node --check arcane-ui.js
          node --check opening.js
          node --check qr-scanner.js
          node --check celestial-ui.js
          node --check adventure-ui.js
          node --check asset-cache.js
          node --check sw.js
          node --check commands.js
          node --check pvp.js
          node --check auth.js
          node --check match-state.js
          node --check worker-lib/security.js
          node --check functions/api/auth/session.js
          node --check functions/api/auth/logout.js
          node --check functions/api/auth/google/start.js
          node --check functions/api/auth/google/callback.js
      - name: Check project consistency
        run: |
          node --test tests/*.test.mjs
          node scripts/security-check.mjs
      - name: Build safe static bundle only
        run: |
          node scripts/build-pages.mjs
          node scripts/security-check.mjs

  deploy:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build isolated static bundle
        run: |
          node scripts/build-pages.mjs
          node scripts/security-check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
